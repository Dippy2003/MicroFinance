name: Daily dependency audit

on:
  schedule:
    # 07:00 Asia/Colombo (UTC+5:30) = 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r requirements.txt
          pip-audit -r requirements.txt --format markdown > ../reports/backend-audit.md || true

      - name: Frontend dependency audit
        working-directory: frontend
        run: |
          npm install --package-lock-only
          npm audit --json > ../reports/frontend-audit.json || true

      - name: Stamp report date
        run: |
          mkdir -p reports
          date -u +"%Y-%m-%d %H:%M UTC" > reports/last-run.txt

      - name: Commit report if changed
        run: |
          git config user.name "Dippy2003"
          git config user.email "200962156+Dippy2003@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: daily dependency audit ($(date -u +%Y-%m-%d))"
          git push
